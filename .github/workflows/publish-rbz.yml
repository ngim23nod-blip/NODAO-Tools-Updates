name: Publish NODAO RBZ

on:
  push:
    branches: [main]
    paths: ['releases/*.json', 'transfer/**', 'scripts/**', 'test/**', '.github/workflows/publish-rbz.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to resume (empty = highest staged version)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nodao-public-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test publication failure and retry scenarios
        run: python3 -m unittest discover -s test -p 'test_release_pipeline.py' -v
      - name: Select validated release request
        id: request
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.release import SEMVER, validate_request
          version = os.environ.get('REQUESTED_VERSION', '')
          if version:
              if not SEMVER.fullmatch(version):
                  raise ValueError('Invalid requested version')
              path = Path(f'releases/v{version}.json')
              validate_request(json.loads(path.read_text()))
          else:
              paths = list(Path('releases').glob('v*.json'))
              for p in paths:
                  data = validate_request(json.loads(p.read_text()))
                  if p.name != f"v{data['version']}.json":
                      raise ValueError('Release filename mismatch')
              path = max(paths, key=lambda p: tuple(map(int, p.stem[1:].split('.')))) if paths else None
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'request={path.as_posix() if path else ""}\n')
          PY
      - name: Reconstruct and stage verified maintenance transfer when present
        if: steps.request.outputs.request != ''
        env:
          NODAO_RELEASE_TOKEN: ${{ github.token }}
          REQUEST_PATH: ${{ steps.request.outputs.request }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json,os; print(json.load(open(os.environ["REQUEST_PATH"]))["version"])')"
          ARTIFACT_URL="$(python3 -c 'import json,os; print(json.load(open(os.environ["REQUEST_PATH"])).get("artifact_url", ""))')"
          TRANSFER_DIR="transfer/v${VERSION}"
          mkdir -p "dist/v${VERSION}"
          if [ -n "$ARTIFACT_URL" ]; then
            curl --fail --location --silent --show-error "$ARTIFACT_URL" -o /tmp/nodao-build.zip
            unzip -p /tmp/nodao-build.zip "nodao_tools_v${VERSION}.rbz" > "dist/v${VERSION}/nodao_tools_v${VERSION}.rbz"
            python3 scripts/release.py stage --request "$REQUEST_PATH"
          elif [ -d "$TRANSFER_DIR" ]; then
            PARTS=("$TRANSFER_DIR"/part_*.b64)
            test -e "${PARTS[0]}"
            cat "${PARTS[@]}" | tr -d '\r\n' | base64 --decode > "dist/v${VERSION}/nodao_tools_v${VERSION}.rbz"
            python3 scripts/release.py stage --request "$REQUEST_PATH"
          fi
      - name: Verify public RBZ, pin immutable commit, then advance manifest
        if: steps.request.outputs.request != ''
        env:
          NODAO_RELEASE_TOKEN: ${{ github.token }}
          REQUEST_PATH: ${{ steps.request.outputs.request }}
        run: |
          set -euo pipefail
          python3 scripts/release.py publish --request "$REQUEST_PATH"
          python3 scripts/release.py verify --request "$REQUEST_PATH"
      - name: Report staging-only state
        if: steps.request.outputs.request == ''
        run: echo 'Pipeline installed; no release request staged.' >> "$GITHUB_STEP_SUMMARY"
