name: Publish NODAO RBZ

on:
  push:
    branches: [main]
    paths:
      - 'transfer/READY.json'

permissions:
  contents: write

concurrency:
  group: nodao-public-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build, verify and publish RBZ
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(jq -r '.version' transfer/READY.json)
          EXPECTED_SHA=$(jq -r '.sha256' transfer/READY.json)
          EXPECTED_SIZE=$(jq -r '.size' transfer/READY.json)
          RELEASED=$(jq -r '.released' transfer/READY.json)

          test -n "$VERSION"
          test "$VERSION" != "null"
          test -n "$EXPECTED_SHA"
          test "$EXPECTED_SHA" != "null"
          test -n "$EXPECTED_SIZE"
          test "$EXPECTED_SIZE" != "null"
          test -n "$RELEASED"
          test "$RELEASED" != "null"
          test -d "transfer/v$VERSION"

          mapfile -d '' PARTS < <(find "transfer/v$VERSION" -type f -name '*.b64' -print0 | sort -z)
          test "${#PARTS[@]}" -gt 0
          cat "${PARTS[@]}" > /tmp/nodao.b64
          base64 -d /tmp/nodao.b64 > "/tmp/nodao_tools_v$VERSION.rbz"

          ACTUAL_SIZE=$(stat -c%s "/tmp/nodao_tools_v$VERSION.rbz")
          ACTUAL_SHA=$(sha256sum "/tmp/nodao_tools_v$VERSION.rbz" | awk '{print $1}')
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          mkdir -p "dist/v$VERSION"
          cp "/tmp/nodao_tools_v$VERSION.rbz" "dist/v$VERSION/nodao_tools_v$VERSION.rbz"
          printf '%s  %s\n' "$EXPECTED_SHA" "nodao_tools_v$VERSION.rbz" > "dist/v$VERSION/SHA256SUMS.txt"
          printf '# NODAO Tools V%s\n\nRBZ de distribution construit automatiquement depuis le source privé.\n' "$VERSION" > "dist/v$VERSION/README.md"

          jq -n \
            --arg version "$VERSION" \
            --arg released "$RELEASED" \
            --arg ref "v$VERSION" \
            --arg path "dist/v$VERSION/nodao_tools_v$VERSION.rbz" \
            --arg sha "$EXPECTED_SHA" \
            '{
              product: "NODAO Tools",
              channel: "stable",
              version: $version,
              released: $released,
              repo_id: 1384193965,
              updater_schema: 1,
              ref: $ref,
              artifact: {
                path: $path,
                sha256: $sha
              }
            }' > latest.json

          rm -rf "transfer/v$VERSION" transfer/READY.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish V$VERSION"
          git push origin HEAD:main

          git tag -f "v$VERSION"
          git push origin -f "refs/tags/v$VERSION"
