name: Publish NODAO RBZ

on:
  push:
    branches: [main]
    paths:
      - 'transfer/READY.json'

permissions:
  contents: write

concurrency:
  group: nodao-public-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build, verify and publish RBZ
        shell: bash
        run: |
          set -uo pipefail

          VERSION=$(jq -r '.version' transfer/READY.json)
          EXPECTED_SHA=$(jq -r '.sha256' transfer/READY.json)
          EXPECTED_SIZE=$(jq -r '.size' transfer/READY.json)
          RELEASED=$(jq -r '.released' transfer/READY.json)

          fail() {
            REASON="$1"
            mkdir -p transfer
            {
              echo "reason=$REASON"
              echo "version=$VERSION"
              echo "expected_size=$EXPECTED_SIZE"
              echo "actual_size=${ACTUAL_SIZE:-unavailable}"
              echo "expected_sha=$EXPECTED_SHA"
              echo "actual_sha=${ACTUAL_SHA:-unavailable}"
              echo "decode_status=${DECODE_STATUS:-unavailable}"
              echo "part_count=${PART_COUNT:-unavailable}"
              echo "b64_bytes=${B64_BYTES:-unavailable}"
              echo "b64_chars=${B64_CHARS:-unavailable}"
              echo "parts:"
              printf '%s\n' "${PARTS[@]:-}"
            } > transfer/FAILURE.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add transfer/FAILURE.txt
            git commit -m "Record V$VERSION publish failure" || true
            git push origin HEAD:main || true
            exit 1
          }

          test -n "$VERSION" && test "$VERSION" != "null" || fail invalid_version
          test -n "$EXPECTED_SHA" && test "$EXPECTED_SHA" != "null" || fail invalid_sha
          test -n "$EXPECTED_SIZE" && test "$EXPECTED_SIZE" != "null" || fail invalid_size
          test -n "$RELEASED" && test "$RELEASED" != "null" || fail invalid_release_date
          test -d "transfer/v$VERSION" || fail missing_transfer_directory

          mapfile -d '' PARTS < <(find "transfer/v$VERSION" -type f -name '*.b64' -print0 | sort -z)
          PART_COUNT=${#PARTS[@]}
          test "$PART_COUNT" -gt 0 || fail no_transfer_parts

          cat "${PARTS[@]}" > /tmp/nodao.b64 || fail concatenate_failed
          B64_BYTES=$(wc -c < /tmp/nodao.b64 | tr -d ' ')
          B64_CHARS=$(tr -d '\r\n\t ' < /tmp/nodao.b64 | wc -c | tr -d ' ')

          set +e
          base64 --decode /tmp/nodao.b64 > "/tmp/nodao_tools_v$VERSION.rbz"
          DECODE_STATUS=$?
          set -e
          test "$DECODE_STATUS" -eq 0 || fail base64_decode_failed

          ACTUAL_SIZE=$(stat -c%s "/tmp/nodao_tools_v$VERSION.rbz")
          ACTUAL_SHA=$(sha256sum "/tmp/nodao_tools_v$VERSION.rbz" | awk '{print $1}')
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE" || fail size_mismatch
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || fail sha_mismatch

          mkdir -p "dist/v$VERSION"
          cp "/tmp/nodao_tools_v$VERSION.rbz" "dist/v$VERSION/nodao_tools_v$VERSION.rbz"
          printf '%s  %s\n' "$EXPECTED_SHA" "nodao_tools_v$VERSION.rbz" > "dist/v$VERSION/SHA256SUMS.txt"
          printf '# NODAO Tools V%s\n\nRBZ de distribution construit automatiquement depuis le source privé.\n' "$VERSION" > "dist/v$VERSION/README.md"

          jq -n \
            --arg version "$VERSION" \
            --arg released "$RELEASED" \
            --arg ref "v$VERSION" \
            --arg path "dist/v$VERSION/nodao_tools_v$VERSION.rbz" \
            --arg sha "$EXPECTED_SHA" \
            '{
              product: "NODAO Tools",
              channel: "stable",
              version: $version,
              released: $released,
              repo_id: 1384193965,
              updater_schema: 1,
              ref: $ref,
              artifact: {
                path: $path,
                sha256: $sha
              }
            }' > latest.json

          rm -rf "transfer/v$VERSION" transfer/READY.json transfer/FAILURE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish V$VERSION"
          git push origin HEAD:main

          git tag -f "v$VERSION"
          git push origin -f "refs/tags/v$VERSION"
